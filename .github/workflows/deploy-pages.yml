name: 质量检查与部署
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fluxnav-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 项目记忆结构与初始化器检查
        run: npm run check:memory
      - name: 快速类型与核心逻辑检查
        run: npm run check:quick
      - name: 存储改动专项验证（仅相关 PR）
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -Fxq -e src/storage.ts -e tests/storage.integration.mjs; then
            npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund fake-indexeddb@6.2.4
            node --experimental-strip-types tests/storage.integration.mjs
          fi
      - name: Web 生产构建
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: 检查站点基础产物
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          node --check dist/sw.js
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
