name: 质量检查与部署
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fluxnav-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - run: npm run build:portable
      - name: 验证发布产物
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist-portable/index.html
          node --check dist/sw.js
          node --check extension/background.js
          mkdir -p release
          cp dist-portable/index.html release/fluxnav-portable.html
          (cd extension && zip -r ../release/fluxnav-extension.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: fluxnav-distribution
          path: release/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fluxnav-distribution
          path: release
      - name: 发布正式版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" release/* --target "$GITHUB_SHA" --title "FluxNav $VERSION" --notes-file CHANGELOG.md
          fi
